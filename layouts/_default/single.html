{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div class="date">{{ .Date | time.Format ":date_long" }}</div>
    {{ if eq .Section "fotografies" }}
      {{ range .Resources.Match "*.{jpg,jpeg,png,webp,JPG,JPEG,PNG}" }}
        {{ $img := . }}
        {{ if gt .Width 1600 }}{{ $img = .Resize "1600x" }}{{ end }}
        <img src="{{ $img.RelPermalink }}" alt="{{ $.Title }}" loading="lazy">
      {{ end }}
    {{ end }}
    {{ .Content }}
  </article>
{{ end }}
