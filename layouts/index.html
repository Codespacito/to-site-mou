{{ define "main" }}
<style>
  body { overflow-x:hidden; }
  /* ---- Φως στο σκοτάδι ---- */
  .lantern { position:relative; width:100vw; margin:-36px 0 0 calc(50% - 50vw); min-height:88vh;
    background:#0b0a09; color:#e9e5dd; overflow:hidden; display:flex; align-items:center; justify-content:center;
    cursor:none; touch-action:pan-y; }
  .lantern-inner { max-width:640px; padding:60px 24px; text-align:center; }
  .lantern-logo { width:200px; margin:0 auto 34px; opacity:.95; }
  .lantern-text p { font-size:1.25rem; line-height:1.85; margin:0 0 1.3em; }
  .lantern-text em { color:#f0b48a; }
  .lantern-text strong { display:block; margin-top:1.6em; font-weight:normal; font-size:1.45rem; color:#ec3b33; letter-spacing:.02em; }
  .lantern-dark { position:absolute; inset:0; pointer-events:none; transition:opacity 1.6s ease;
    background:radial-gradient(circle var(--r,190px) at var(--x,50%) var(--y,30%),
      rgba(11,10,9,0) 0%, rgba(11,10,9,.35) 45%, rgba(11,10,9,.93) 85%, rgba(11,10,9,.985) 100%); }
  .lantern-glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; transition:opacity 1.6s ease;
    background:radial-gradient(circle calc(var(--r,190px) * .9) at var(--x,50%) var(--y,30%),
      rgba(255,160,80,.16) 0%, rgba(255,120,60,.05) 50%, rgba(0,0,0,0) 100%); }
  .lantern.lit { cursor:auto; }
  .lantern.lit .lantern-dark, .lantern.lit .lantern-glow { opacity:0; }
  .lantern-btn { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); cursor:pointer;
    background:transparent; color:#a39d93; border:1px solid #3a3530; border-radius:20px; padding:7px 16px;
    font:0.8rem system-ui,sans-serif; letter-spacing:.04em; }
  .lantern-btn:hover { color:#e9e5dd; border-color:#6a6058; }
  .lantern-hint { position:absolute; top:22px; left:0; right:0; text-align:center; color:#6f675e;
    font:0.8rem system-ui,sans-serif; letter-spacing:.06em; transition:opacity 1s; }
  .lantern.lit .lantern-hint { opacity:0; }

  /* ---- Βελανίδι ---- */
  .acorn-sec { text-align:center; padding:56px 0 30px; }
  .acorn { background:none; border:none; cursor:pointer; padding:10px; color:var(--accent); }
  .acorn svg { width:96px; height:120px; overflow:visible; }
  .acorn .cap, .acorn .nut { transition:transform .7s cubic-bezier(.3,1.4,.5,1); transform-box:fill-box; }
  .acorn .cap { transform-origin:30% 100%; }
  .acorn .nut { transform-origin:50% 0%; }
  .acorn:hover .nut { transform:rotate(-4deg); }
  .acorn.open .cap { transform:translate(-10px,-22px) rotate(-24deg); }
  .acorn.open .nut { transform:rotate(3deg); }
  .acorn-hint { font:0.85rem system-ui,sans-serif; color:var(--muted); margin:6px 0 0; letter-spacing:.04em; }
  .quote { max-width:560px; margin:26px auto 0; opacity:0; transform:translateY(8px); transition:opacity .9s, transform .9s; }
  .quote.show { opacity:1; transform:none; }
  .quote p { font-size:1.3rem; line-height:1.7; font-style:italic; margin:0; }
  .quote .qorig { font-size:0.95rem; font-style:normal; color:var(--muted); margin-top:10px; line-height:1.6; }
  .quote .qorig:empty { display:none; }
  .quote .qauth { margin-top:12px; font:0.85rem system-ui,sans-serif; color:var(--muted); letter-spacing:.04em; }
  @media (prefers-reduced-motion: reduce) {
    .acorn .cap, .acorn .nut, .quote, .lantern-dark, .lantern-glow { transition:none; }
  }
</style>

<section class="lantern" id="lantern">
  <div class="lantern-hint">κίνησε το φως</div>
  <div class="lantern-inner">
    <img class="lantern-logo" src="{{ "logo.png" | relURL }}" alt="{{ site.Title }}">
    <div class="lantern-text">{{ .Content }}</div>
  </div>
  <div class="lantern-dark" aria-hidden="true"></div>
  <div class="lantern-glow" aria-hidden="true"></div>
  <button type="button" class="lantern-btn" id="lanternAll">άναψε όλο το φως</button>
</section>

<section class="acorn-sec">
  <button type="button" class="acorn" id="acorn" aria-label="Άνοιξε ένα βελανίδι">
    <svg viewBox="0 0 100 125" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g class="nut">
        <path d="M22 52 C 20 82, 34 108, 50 118 C 66 108, 80 82, 78 52 Z"/>
        <path d="M40 70 C 38 84, 42 96, 48 104" stroke-width="1.6" opacity=".6"/>
      </g>
      <g class="cap">
        <path d="M14 52 C 14 34, 30 24, 50 24 C 70 24, 86 34, 86 52 C 72 58, 28 58, 14 52 Z"/>
        <path d="M26 36 L 38 50 M38 29 L 52 50 M52 26 L 64 48 M64 29 L 74 46 M30 46 L 42 34 M44 52 L 58 32 M60 52 L 72 36" stroke-width="1.4" opacity=".75"/>
        <path d="M50 24 C 50 16, 54 10, 60 6" stroke-width="3.4"/>
      </g>
    </svg>
  </button>
  <p class="acorn-hint">Άνοιξε ένα βελανίδι</p>
  <blockquote class="quote" id="quote" aria-live="polite"><p id="qtext"></p><p class="qorig" id="qorig"></p><div class="qauth" id="qauth"></div></blockquote>
</section>

<template id="gnomika">
  {{- with site.Data.gnomika }}{{ range .gnomika }}
  <div data-author="{{ .syggrafeas | default "" }}" data-orig="{{ .prototypo | default "" }}" data-pigi="{{ .pigi | default "" }}">{{ .keimeno }}</div>
  {{- end }}{{ end }}
</template>

<h2 style="font-weight:normal">Πρόσφατα</h2>
<ul class="list">
  {{ range first 15 (where site.RegularPages "Section" "ne" "").ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a><br>
      <span class="meta">{{ with .Parent }}{{ .Title }} · {{ end }}{{ .Date | time.Format ":date_long" }}</span>
    </li>
  {{ end }}
</ul>

<script src="{{ "home.js" | relURL }}"></script>
{{ end }}
