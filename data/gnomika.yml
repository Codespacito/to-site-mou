# Γνωμικά για το βελανίδι.
# keimeno: το γνωμικό στα νέα ελληνικά (αυτό φαίνεται μεγάλο)
# prototypo: το πρωτότυπο (προαιρετικό, φαίνεται μικρό από κάτω)
# syggrafeas: ποιος το είπε
# pigi: από πού (προαιρετικό)
gnomika:
  # ---------------- Ηράκλειτος (αρχαία αποσπάσματα, αρίθμηση Diels-Kranz) ----------------
  - keimeno: "Ο χαρακτήρας του ανθρώπου είναι η μοίρα του."
    prototypo: "Ἦθος ἀνθρώπῳ δαίμων."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 119"
  - keimeno: "Αναζήτησα τον εαυτό μου."
    prototypo: "Ἐδιζησάμην ἐμεωυτόν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 101"
  - keimeno: "Τα όρια της ψυχής δεν θα τα βρεις, όποιον δρόμο κι αν περπατήσεις· τόσο βαθύ λόγο έχει."
    prototypo: "Ψυχῆς πείρατα ἰὼν οὐκ ἂν ἐξεύροιο, πᾶσαν ἐπιπορευόμενος ὁδόν· οὕτω βαθὺν λόγον ἔχει."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 45"
  - keimeno: "Η φύση αγαπά να κρύβεται."
    prototypo: "Φύσις κρύπτεσθαι φιλεῖ."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 123"
  - keimeno: "Η αθέατη αρμονία είναι ανώτερη από τη φανερή."
    prototypo: "Ἁρμονίη ἀφανὴς φανερῆς κρείττων."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 54"
  - keimeno: "Δεν μπορείς να μπεις δύο φορές στο ίδιο ποτάμι."
    prototypo: "Ποταμῷ γὰρ οὐκ ἔστιν ἐμβῆναι δὶς τῷ αὐτῷ."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 91"
  - keimeno: "Ο δρόμος προς τα πάνω και ο δρόμος προς τα κάτω είναι ένας και ο ίδιος."
    prototypo: "Ὁδὸς ἄνω κάτω μία καὶ ὡυτή."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 60"
  - keimeno: "Ο πόλεμος είναι πατέρας όλων και βασιλιάς όλων."
    prototypo: "Πόλεμος πάντων μὲν πατήρ ἐστι, πάντων δὲ βασιλεύς."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 53"
  - keimeno: "Αν δεν ελπίζεις το ανέλπιστο, δεν θα το βρεις· γιατί είναι ανεξερεύνητο και δύσβατο."
    prototypo: "Ἐὰν μὴ ἔλπηται, ἀνέλπιστον οὐκ ἐξευρήσει, ἀνεξερεύνητον ἐὸν καὶ ἄπορον."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 18"
  - keimeno: "Όλοι οι άνθρωποι έχουν μερίδιο στο να γνωρίζουν τον εαυτό τους και να σκέφτονται σωστά."
    prototypo: "Ἀνθρώποισι πᾶσι μέτεστι γινώσκειν ἑωυτοὺς καὶ σωφρονεῖν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 116"
  - keimeno: "Η σωστή σκέψη είναι η μεγαλύτερη αρετή· και σοφία είναι να λες την αλήθεια και να πράττεις σύμφωνα με τη φύση, αφουγκραζόμενος."
    prototypo: "Τὸ φρονεῖν ἀρετὴ μεγίστη, καὶ σοφίη ἀληθέα λέγειν καὶ ποιεῖν κατὰ φύσιν ἐπαΐοντας."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 112"
  - keimeno: "Η σκέψη είναι κοινή σε όλους."
    prototypo: "Ξυνόν ἐστι πᾶσι τὸ φρονέειν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 113"
  - keimeno: "Η πολυμάθεια δεν διδάσκει να έχεις νου."
    prototypo: "Πολυμαθίη νόον ἔχειν οὐ διδάσκει."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 40"
  - keimeno: "Τον κόσμο τούτο δεν τον έφτιαξε ούτε θεός ούτε άνθρωπος· ήταν πάντα, είναι και θα είναι φωτιά αείζωη, που ανάβει με μέτρο και σβήνει με μέτρο."
    prototypo: "Κόσμον τόνδε, τὸν αὐτὸν ἁπάντων, οὔτε τις θεῶν οὔτε ἀνθρώπων ἐποίησεν, ἀλλ' ἦν ἀεὶ καὶ ἔστιν καὶ ἔσται πῦρ ἀείζωον, ἁπτόμενον μέτρα καὶ ἀποσβεννύμενον μέτρα."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 30"
  - keimeno: "Το ίδιο είναι μέσα μας το ζωντανό και το νεκρό, το ξύπνιο και το κοιμισμένο, το νέο και το γέρικο."
    prototypo: "Ταὐτό τ' ἔνι ζῶν καὶ τεθνηκὸς καὶ τὸ ἐγρηγορὸς καὶ τὸ καθεῦδον καὶ νέον καὶ γηραιόν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 88"
  - keimeno: "Αθάνατοι θνητοί, θνητοί αθάνατοι· ζουν ο ένας τον θάνατο του άλλου και πεθαίνουν ο ένας τη ζωή του άλλου."
    prototypo: "Ἀθάνατοι θνητοί, θνητοὶ ἀθάνατοι, ζῶντες τὸν ἐκείνων θάνατον, τὸν δὲ ἐκείνων βίον τεθνεῶτες."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 62"
  - keimeno: "Τους ανθρώπους, όταν πεθάνουν, τους περιμένουν όσα ούτε ελπίζουν ούτε φαντάζονται."
    prototypo: "Ἀνθρώπους μένει ἀποθανόντας ἅσσα οὐκ ἔλπονται οὐδὲ δοκέουσιν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 27"
  - keimeno: "Ο χρόνος είναι παιδί που παίζει πεσσούς· η βασιλεία ανήκει σε ένα παιδί."
    prototypo: "Αἰὼν παῖς ἐστι παίζων, πεσσεύων· παιδὸς ἡ βασιληίη."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 52"
  - keimeno: "Κακοί μάρτυρες για τους ανθρώπους είναι τα μάτια και τα αυτιά, όταν έχουν βάρβαρες ψυχές."
    prototypo: "Κακοὶ μάρτυρες ἀνθρώποισιν ὀφθαλμοὶ καὶ ὦτα βαρβάρους ψυχὰς ἐχόντων."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 107"
  - keimeno: "Την αλαζονεία πρέπει να τη σβήνεις πιο γρήγορα κι από πυρκαγιά."
    prototypo: "Ὕβριν χρὴ σβεννύναι μᾶλλον ἢ πυρκαϊήν."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 43"
  - keimeno: "Αν ακούσετε όχι εμένα αλλά τον λόγο, σοφό είναι να παραδεχτείτε ότι όλα είναι ένα."
    prototypo: "Οὐκ ἐμοῦ ἀλλὰ τοῦ λόγου ἀκούσαντας ὁμολογεῖν σοφόν ἐστιν ἓν πάντα εἶναι."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 50"
  - keimeno: "Όσοι ψάχνουν χρυσάφι σκάβουν πολύ χώμα και βρίσκουν λίγο."
    prototypo: "Χρυσὸν γὰρ οἱ διζήμενοι γῆν πολλὴν ὀρύσσουσι καὶ εὑρίσκουσιν ὀλίγον."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 22"
  - keimeno: "Δεν είναι καλό για τους ανθρώπους να τους γίνεται ό,τι θέλουν."
    prototypo: "Ἀνθρώποις γίνεσθαι ὁκόσα θέλουσιν οὐκ ἄμεινον."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 110"
  - keimeno: "Τα κρύα ζεσταίνονται, το ζεστό κρυώνει, το υγρό στεγνώνει, το ξερό νοτίζει."
    prototypo: "Τὰ ψυχρὰ θέρεται, θερμὸν ψύχεται, ὑγρὸν αὐαίνεται, καρφαλέον νοτίζεται."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 126"
  - keimeno: "Αλλάζοντας, αναπαύεται."
    prototypo: "Μεταβάλλον ἀναπαύεται."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 84a"
  - keimeno: "Ας μη βγάζουμε βιαστικά συμπεράσματα για τα πιο μεγάλα ζητήματα."
    prototypo: "Μὴ εἰκῆ περὶ τῶν μεγίστων συμβαλλώμεθα."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 47"
  - keimeno: "Η στεγνή ψυχή είναι η σοφότερη και η καλύτερη."
    prototypo: "Αὔη ψυχὴ σοφωτάτη καὶ ἀρίστη."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 118"
  - keimeno: "Η ψυχή έχει έναν λόγο που μεγαλώνει από μόνος του."
    prototypo: "Ψυχῆς ἐστι λόγος ἑαυτὸν αὔξων."
    syggrafeas: "Ηράκλειτος"
    pigi: "απόσπ. 115"

  # ---------------- W. B. Yeats (στίχοι από ποιήματα έως το 1928, δική μας μετάφραση) ----------------
  - keimeno: "Πάτα απαλά, γιατί πατάς πάνω στα όνειρά μου."
    prototypo: "Tread softly because you tread on my dreams."
    syggrafeas: "W. B. Yeats"
    pigi: "He Wishes for the Cloths of Heaven, 1899"
  - keimeno: "Όλα σκορπίζουν· το κέντρο δεν κρατά."
    prototypo: "Things fall apart; the centre cannot hold."
    syggrafeas: "W. B. Yeats"
    pigi: "The Second Coming, 1920"
  - keimeno: "Οι καλύτεροι έχουν χάσει κάθε πίστη, ενώ οι χειρότεροι είναι γεμάτοι πάθος και ορμή."
    prototypo: "The best lack all conviction, while the worst / Are full of passionate intensity."
    syggrafeas: "W. B. Yeats"
    pigi: "The Second Coming, 1920"
  - keimeno: "Μια τρομερή ομορφιά γεννήθηκε."
    prototypo: "A terrible beauty is born."
    syggrafeas: "W. B. Yeats"
    pigi: "Easter, 1916"
  - keimeno: "Μια θυσία που κρατά πολύ μπορεί να κάνει πέτρα την καρδιά."
    prototypo: "Too long a sacrifice / Can make a stone of the heart."
    syggrafeas: "W. B. Yeats"
    pigi: "Easter, 1916"
  - keimeno: "Πώς να ξεχωρίσεις τον χορευτή από τον χορό;"
    prototypo: "How can we know the dancer from the dance?"
    syggrafeas: "W. B. Yeats"
    pigi: "Among School Children, 1928"
  - keimeno: "Ο γέρος δεν είναι παρά ένα τίποτα, ένα κουρελιασμένο πανωφόρι σε ραβδί, εκτός αν η ψυχή χτυπήσει παλαμάκια και τραγουδήσει."
    prototypo: "An aged man is but a paltry thing, / A tattered coat upon a stick, unless / Soul clap its hands and sing."
    syggrafeas: "W. B. Yeats"
    pigi: "Sailing to Byzantium, 1928"
  - keimeno: "Κι εκεί θα βρω λίγη γαλήνη, γιατί η γαλήνη στάζει αργά."
    prototypo: "And I shall have some peace there, for peace comes dropping slow."
    syggrafeas: "W. B. Yeats"
    pigi: "The Lake Isle of Innisfree, 1890"
  - keimeno: "Έλα μακριά, παιδί του ανθρώπου, στα νερά και στην αγριάδα."
    prototypo: "Come away, O human child! / To the waters and the wild."
    syggrafeas: "W. B. Yeats"
    pigi: "The Stolen Child, 1886"
  - keimeno: "Ο κόσμος είναι πιο γεμάτος κλάμα απ' όσο μπορείς να καταλάβεις."
    prototypo: "For the world's more full of weeping than you can understand."
    syggrafeas: "W. B. Yeats"
    pigi: "The Stolen Child, 1886"
  - keimeno: "Το κρασί μπαίνει από το στόμα κι η αγάπη μπαίνει από τα μάτια."
    prototypo: "Wine comes in at the mouth / And love comes in at the eye."
    syggrafeas: "W. B. Yeats"
    pigi: "A Drinking Song, 1910"

  # ---------------- Επίκουρος (αρχαία κείμενα, δική μας απόδοση) ----------------
  - keimeno: "Ζήσε απαρατήρητος."
    prototypo: "Λάθε βιώσας."
    syggrafeas: "Επίκουρος"
  - keimeno: "Μία φορά γεννηθήκαμε άνθρωποι· δεύτερη φορά δεν γίνεται."
    prototypo: "Ἅπαξ ἄνθρωποι γεγόναμεν, δὶς δὲ οὐκ ἔστι γενέσθαι."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 14"
  - keimeno: "Είναι μάταιο να ζητάς από τους θεούς όσα μπορείς να δώσεις μόνος στον εαυτό σου."
    prototypo: "Μάταιόν ἐστι παρὰ θεῶν αἰτεῖσθαι ἅ τις ἑαυτῷ χορηγῆσαι ἱκανός ἐστι."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 65"
  - keimeno: "Όλοι φεύγουμε από τη ζωή σαν να μόλις γεννηθήκαμε."
    prototypo: "Πᾶς ὥσπερ ἄρτι γεγονὼς ἐκ τοῦ ζῆν ἀπέρχεται."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 60"
  - keimeno: "Ο θάνατος δεν μας αφορά· ό,τι διαλύθηκε δεν αισθάνεται, κι ό,τι δεν αισθάνεται δεν μας αφορά."
    prototypo: "Ὁ θάνατος οὐδὲν πρὸς ἡμᾶς· τὸ γὰρ διαλυθὲν ἀναισθητεῖ, τὸ δ' ἀναισθητοῦν οὐδὲν πρὸς ἡμᾶς."
    syggrafeas: "Επίκουρος"
    pigi: "Κύριαι Δόξαι, 2"
  - keimeno: "Με θηριώδη δουλειά μαζεύεται πολύς πλούτος, αλλά στήνεται μια ζωή γεμάτη ταλαιπωρία."
    prototypo: "Ἐξ ἐργασίας θηριώδους οὐσίας μὲν πλῆθος συσσωρεύεται, βίος δὲ ταλαίπωρος συνίσταται."
    syggrafeas: "Επίκουρος"
  - keimeno: "Ο θεός δεν είναι για φόβο, ο θάνατος δεν είναι για ανησυχία· το καλό αποκτιέται εύκολα, και το κακό υπομένεται εύκολα."
    prototypo: "Ἄφοβον ὁ θεός, ἀνύποπτον ὁ θάνατος· καὶ τἀγαθὸν μὲν εὔκτητον, τὸ δὲ δεινὸν εὐκαρτέρητον."
    syggrafeas: "Επίκουρος"
    pigi: "η «Τετραφάρμακος»"
  - keimeno: "Πρέπει λοιπόν να μελετάμε όσα φέρνουν την ευδαιμονία· γιατί όταν την έχουμε, τα έχουμε όλα, κι όταν λείπει, κάνουμε τα πάντα για να την αποκτήσουμε."
    prototypo: "Μελετᾶν οὖν χρὴ τὰ ποιοῦντα τὴν εὐδαιμονίαν, εἴπερ παρούσης μὲν αὐτῆς πάντα ἔχομεν, ἀπούσης δὲ πάντα πράττομεν εἰς τὸ ταύτην ἔχειν."
    syggrafeas: "Επίκουρος"
    pigi: "Επιστολή προς Μενοικέα, 122"
  - keimeno: "Ο δίκαιος έχει τη μεγαλύτερη γαλήνη· ο άδικος είναι γεμάτος ταραχή."
    prototypo: "Ὁ δίκαιος ἀταρακτότατος, ὁ δ' ἄδικος πλείστης ταραχῆς γέμων."
    syggrafeas: "Επίκουρος"
    pigi: "Κύριαι Δόξαι, 17"
  - keimeno: "Πρέπει να λύσουμε τους εαυτούς μας από τη φυλακή των καθημερινών υποθέσεων και της πολιτικής."
    prototypo: "Ἐκλυτέον ἑαυτοὺς ἐκ τοῦ περὶ τὰ ἐγκύκλια καὶ πολιτικὰ δεσμωτηρίου."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 58"
  - keimeno: "Η ανάγκη είναι κακό, αλλά καμία ανάγκη δεν σε υποχρεώνει να ζεις μέσα στην ανάγκη."
    prototypo: "Κακὸν ἀνάγκη, ἀλλ' οὐδεμία ἀνάγκη ζῆν μετὰ ἀνάγκης."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 9"
  - keimeno: "Το μακάριο και άφθαρτο ον ούτε το ίδιο έχει έγνοιες ούτε δίνει σε άλλον· γι' αυτό δεν το κυριεύουν ούτε θυμοί ούτε εύνοιες, γιατί όλα αυτά ανήκουν στον αδύναμο."
    prototypo: "Τὸ μακάριον καὶ ἄφθαρτον οὔτε αὐτὸ πράγματα ἔχει οὔτε ἄλλῳ παρέχει, ὥστε οὔτε ὀργαῖς οὔτε χάρισι συνέχεται· ἐν ἀσθενεῖ γὰρ πᾶν τὸ τοιοῦτον."
    syggrafeas: "Επίκουρος"
    pigi: "Κύριαι Δόξαι, 1"
  - keimeno: "Θεοί υπάρχουν· γιατί η γνώση τους είναι ολοφάνερη."
    prototypo: "Θεοὶ μὲν γάρ εἰσιν· ἐναργὴς γὰρ αὐτῶν ἐστιν ἡ γνῶσις."
    syggrafeas: "Επίκουρος"
    pigi: "Επιστολή προς Μενοικέα, 123"
  - keimeno: "Ευγνωμοσύνη στη μακάρια φύση, που έκανε τα αναγκαία εύκολα να τα βρεις, και όσα βρίσκονται δύσκολα, όχι αναγκαία."
    prototypo: "Χάρις τῇ μακαρίᾳ φύσει, ὅτι τὰ ἀναγκαῖα ἐποίησεν εὐπόριστα, τὰ δὲ δυσπόριστα οὐκ ἀναγκαῖα."
    syggrafeas: "Επίκουρος"
    pigi: "ίσως πρωτοειπώθηκε από τον Μητρόδωρο τον Χίο"
  - keimeno: "Δεν πρέπει να κάνουμε πως φιλοσοφούμε, αλλά να φιλοσοφούμε στ' αλήθεια· γιατί δεν χρειαζόμαστε να φαινόμαστε υγιείς, αλλά να είμαστε υγιείς πραγματικά."
    prototypo: "Οὐ προσποιεῖσθαι δεῖ φιλοσοφεῖν, ἀλλ' ὄντως φιλοσοφεῖν· οὐ γὰρ προσδεόμεθα τοῦ δοκεῖν ὑγιαίνειν, ἀλλὰ τοῦ κατ' ἀλήθειαν ὑγιαίνειν."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 54"
  - keimeno: "Δεν μπορείς να ζεις ευχάριστα χωρίς να ζεις με φρόνηση, ομορφιά και δικαιοσύνη· ούτε με φρόνηση, ομορφιά και δικαιοσύνη χωρίς να ζεις ευχάριστα."
    prototypo: "Οὐκ ἔστιν ἡδέως ζῆν ἄνευ τοῦ φρονίμως καὶ καλῶς καὶ δικαίως, οὐδὲ φρονίμως καὶ καλῶς καὶ δικαίως ἄνευ τοῦ ἡδέως."
    syggrafeas: "Επίκουρος"
    pigi: "Κύριαι Δόξαι, 5"
  - keimeno: "Να χαίρεστε, και να θυμάστε τη διδασκαλία."
    prototypo: "Χαίρετε καὶ μέμνησθε τὰ δόγματα."
    syggrafeas: "Επίκουρος"
    pigi: "τα τελευταία του λόγια, κατά τον Διογένη Λαέρτιο"
  - keimeno: "Απέναντι σε όλα τα άλλα μπορείς να βρεις ασφάλεια· όμως απέναντι στον θάνατο, όλοι οι άνθρωποι κατοικούμε σε πόλη χωρίς τείχη."
    prototypo: "Πρὸς μὲν τἆλλα δυνατὸν ἀσφάλειαν πορίσασθαι, χάριν δὲ θανάτου πάντες ἄνθρωποι πόλιν ἀτείχιστον οἰκοῦμεν."
    syggrafeas: "Επίκουρος"
    pigi: "Βατικανά Γνωμικά, 31"
