baseURL = "https://xn----olbqgg2aacrwaqdw9r.xn--qxam/"
languageCode = "el"
defaultContentLanguage = "el"
title = "Άγριοι Δολιανών"

# Δεν χρειαζόμαστε tags/κατηγορίες προς το παρόν
